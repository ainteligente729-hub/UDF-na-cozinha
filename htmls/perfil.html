
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da receita | UDF na Cozinha</title>

    <link rel="stylesheet" href="../estilos.css">

    <style>
        .detalhes-receita {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
        }

        .detalhes-receita h2 {
            color: #142A40;
        }

        .detalhes-receita h3 {
            color: #D99A18;
        }

        .foto-receita {
            display: block;
            max-width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 12px;
            margin: 20px auto;
        }

        .informacoes {
            background: #F8F6F0;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .detalhes-receita li {
            margin-bottom: 12px;
        }
        #btn-favoritar {
    background: white;
    color: #D99A18;
    border: 2px solid #D99A18;
    border-radius: 8px;
    padding: 10px 18px;
    font-size: 15px;
    font-weight: bold;
    cursor: pointer;
    transition: 0.2s;
    display: block;
visibility: visible;
}

#btn-favoritar:hover {
    background: #D99A18;
    color: white;
}

    </style>
</head>

<body>

<header class="cabecalho-receita">
    <a href="index.html" class="marca-receita">
        <img
            src="../imagem/Logo UDF-Na-Cozinha.png"
            alt="Logo UDF na Cozinha"
        >
    </a>

    <nav class="menu-receita">
        <a href="index.html">Início</a>
        <a href="minhas-receitas.html">Minhas receitas</a>
        <a href="cadastro-receita.html">Nova receita</a>
        <a href="favoritos.html">Favoritos</a>
        <a href="perfil.html">Perfil</a>

        <button type="button" id="btn-sair">
            Sair
        </button>
    </nav>
</header>


    <main class="detalhes-receita">
        <p id="mensagem">Carregando receita...</p>

        <div id="conteudo-receita" hidden>
         <h1 id="titulo-receita"></h1>

<button id="btn-favoritar">
    ♡ Favoritar receita
</button>

<img id="imagem-receita" class="foto-receita" alt="">
            <p id="descricao-receita"></p>

            <div class="informacoes">
                
<div class="autor-destaque">
    <div class="autor-avatar">
        <span>👤</span>
    </div>

    <div class="autor-informacoes">
        <span class="autor-legenda">
            RECEITA PUBLICADA POR
        </span>

        <p id="autor-receita"></p>
    </div>
</div>

                <p id="categoria-receita"></p>
                <p id="dificuldade-receita"></p>
                <p id="tempo-receita"></p>
                <p id="rendimento-receita"></p>
            </div>

            <h2>Ingredientes</h2>
            <ul id="ingredientes-receita"></ul>

            <h2>Modo de preparo</h2>
            <ol id="passos-receita"></ol>
        </div>
    </main>

    <script src="../js/detalhes-receita.js"></script>
    <script src="../js/menu.js"></script>
</body>
</html>
