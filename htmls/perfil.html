
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Perfil | UDF na Cozinha</title>
    <link rel="stylesheet" href="../estilos.css">
</head>
<body>


<header class="cabecalho-site">

    <a href="index.html" class="marca-site">
        <img
            src="../imagem/Logo UDF-Na-Cozinha.png"
            alt="Logo UDF na Cozinha"
        >
    </a>

    <nav class="menu-principal">
        <a href="index.html">Início</a>

        <a href="minhas-receitas.html">Minhas receitas</a>

        <a href="cadastro-receita.html">Cadastrar receita</a>

        <a href="favoritos.html">Favoritos</a>

        <a href="perfil.html">Perfil</a>

        <button type="button" id="btn-sair">Sair</button>
    </nav>

</header>


<main class="pagina-perfil">

    <section class="cabecalho-perfil">
       
<div class="area-foto-perfil">
    <img
        id="foto-perfil"
        alt="Foto de perfil"
        class="foto-perfil"
        hidden
    >

    <div id="avatar-padrao" class="avatar-perfil">
        👤
    </div>

    <label for="input-foto" class="botao-foto">
        📷 Alterar foto
    </label>

    <input
        type="file"
        id="input-foto"
        accept="image/png,image/jpeg,image/webp"
        hidden
    >
</div>

        <h1 id="nome-perfil">Carregando...</h1>
        <p>Minhas publicações</p>
    </section>


<div class="divisoria-perfil">
    <span>✦</span>
</div>


    <section class="receitas-perfil">
        <h2>🍽️ Receitas publicadas</h2>

        <div id="lista-receitas-perfil"
             class="lista-receitas">
            <p>Carregando receitas...</p>
        </div>
    </section>

</main>

<script src="../js/menu.js"></script>
<script src="../js/perfil.js"></script>

</body>
</html>
