
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes da receita | UDF na Cozinha</title>

    <link rel="stylesheet" href="../estilos.css">

    <style>
        .detalhes-receita {
            max-width: 900px;
            margin: 40px auto;
            padding: 30px;
            background: white;
            border-radius: 15px;
        }

        .detalhes-receita h2 {
            color: #142A40;
        }

        .detalhes-receita h3 {
            color: #D99A18;
        }

        .foto-receita {
            display: block;
            max-width: 100%;
            max-height: 350px;
            object-fit: cover;
            border-radius: 12px;
            margin: 20px auto;
        }

        .informacoes {
            background: #F8F6F0;
            padding: 15px;
            border-radius: 10px;
            margin: 20px 0;
        }

        .detalhes-receita li {
            margin-bottom: 12px;
        }
    </style>
</head>

<body>
    <header>
        <nav>
            <a href="../index.html">Início</a>
            <a href="../login.html" data-visivel="visitante">Entrar</a>
            <a href="../cadastro.html" data-visivel="visitante">Criar conta</a>
            <a href="favoritos.html" data-visivel="logado">Meus favoritos</a>
            <a href="../cadastro-receita.html" data-visivel="autor admin">Nova receita</a>
            <a href="admin.html" data-visivel="admin">Painel</a>
            <button type="button" id="btn-sair" data-visivel="logado">Sair</button>
        </nav>
    </header>

    <main class="detalhes-receita">
        <p id="mensagem">Carregando receita...</p>

        <div id="conteudo-receita" hidden>
            <h1 id="titulo-receita"></h1>

            <img id="imagem-receita" class="foto-receita" alt="">

            <p id="descricao-receita"></p>

            <div class="informacoes">
                <p id="autor-receita"></p>
                <p id="categoria-receita"></p>
                <p id="dificuldade-receita"></p>
                <p id="tempo-receita"></p>
                <p id="rendimento-receita"></p>
            </div>

            <h2>Ingredientes</h2>
            <ul id="ingredientes-receita"></ul>

            <h2>Modo de preparo</h2>
            <ol id="passos-receita"></ol>
        </div>
    </main>

    <script src="../js/detalhes-receita.js"></script>
</body>
</html>
