<!DOCTYPE html>

<html lang="pt-BR">

<head>

    <meta charset="UTF-8">

    <title>Cadastro - UDF na Cozinha</title>

    <link rel="stylesheet" href="estilos.css">

</head>

<body>

    <main class="login">

        <img src="imagem/Logo UDF-Na-Cozinha.png" alt="Logo UDF na Cozinha">

        <h1>Criar conta</h1>

        <p>
            Cadastre-se para começar a compartilhar suas receitas.
        </p>


        <form id="form-cadastro">

            <label for="nome">Nome:</label>
            <input type="text" id="nome" name="nome" placeholder="Digite seu nome" required>
        
            <label for="email">E-mail:</label>
            <input type="email" id="email" name="email" placeholder="Digite seu e-mail" required>
            
            <label for="senha">Senha:</label>
            <input type="password" id="senha" name="senha" placeholder="Digite sua senha" required>

            <label for="confirmar-senha">Confirmar senha:</label>
            <input type="password" id="confirmar-senha" name="confirmar-senha" placeholder="Digite sua senha novamente" required>


            <button type="submit" class="botao-principal">
                Criar conta
            </button>

        </form>


        <p>
            Já possui uma conta?
            <a href="login.html">Fazer login</a>
        </p>

        <script src="js/cadastro.js"></script>
    </main>

    
</body>

</html>
